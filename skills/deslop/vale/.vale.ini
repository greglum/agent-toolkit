# Deslop Vale configuration. Copied into the cache by scripts/lint.sh.
# E-Prime is off because the humanizer prefers is, are, and has over
# "serves as" and "functions as". Spelling is off because technical writing
# is full of product and code words; the rewrite step handles real typos.
StylesPath = styles
MinAlertLevel = warning
Packages = write-good, proselint, Readability

[*.{md,mdx,markdown,rst,adoc,html,txt}]
BasedOnStyles = Vale, write-good, proselint, Readability
Vale.Spelling = NO
write-good.E-Prime = NO
